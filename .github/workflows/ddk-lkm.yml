name: Build KernelSU Kernel Module

# Self-hosted runner variant: the DDK image is pulled once and reused locally,
# checkout and artifact transport use plain scripts. Artifacts land in
# ${CI_ARTIFACT_ROOT} on the runner host instead of the GitHub artifact service.
on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
      release_build:
        description: 'Mark version metadata as a release build'
        required: false
        default: false
        type: boolean
      version_code:
        description: 'Consistent KernelSU version code for all module builds'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged
    env:
      # Each job container already runs one make; capping it keeps four
      # concurrent jobs from fighting over the host's cores.
      MAKEFLAGS: "-j6"
      KMI: ${{ inputs.kmi }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      EXPECTED_SIZE: ${{ inputs.expected_size }}
      EXPECTED_HASH: ${{ inputs.expected_hash }}
      KSU_VERSION_CODE: ${{ inputs.version_code }}
      RELEASE_BUILD: ${{ inputs.release_build }}

    steps:
      - name: Checkout source code
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          remote="https://git.zako.shirkneko.top:20004"
          mirror="/ci/repo-cache/${GITHUB_REPOSITORY}.git"
          mkdir -p "$(dirname "$mirror")"
          # One bare mirror per repository lives on the runner host, shared by
          # every job through the /ci volume. Re-downloading the whole history
          # per job made parallel jobs stall on the same fetch.
          if [ ! -d "$mirror" ]; then
            git -c "http.${remote}/.extraHeader=Authorization: token ${TOKEN}" \
              clone -q --mirror "${remote}/${GITHUB_REPOSITORY}.git" "$mirror"
          elif command -v flock >/dev/null 2>&1; then
            (
              flock 9
              git --git-dir="$mirror" fetch -q --prune origin \
                "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
            ) 9>"${mirror}.lock"
          else
            git --git-dir="$mirror" fetch -q --prune origin \
              "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          fi
          git clone -q --shared --no-checkout "$mirror" .
          git checkout -q "${GITHUB_SHA}"

      - name: Build kernelsu.ko
        run: |
          set -eu
          cd kernel

          echo "=== Building kernelsu.ko for KMI: ${KMI} ==="

          set -- CONFIG_KSU=m CONFIG_KPM=y CC=clang
          if [ -n "$PACKAGE_NAME" ]; then
            set -- "$@" "KSU_PACKAGE_NAME=$PACKAGE_NAME"
          fi
          if [ -n "$EXPECTED_SIZE" ]; then
            set -- "$@" "KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
          fi
          if [ -n "$EXPECTED_HASH" ]; then
            set -- "$@" "KSU_EXPECTED_HASH=$EXPECTED_HASH"
          fi
          if [ -n "$KSU_VERSION_CODE" ]; then
            set -- "$@" "KSU_VERSION=$KSU_VERSION_CODE"
          fi
          if [ "$RELEASE_BUILD" = "true" ]; then
            set -- "$@" "KSU_BUILD_REF=release"
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            set -- "$@" "KSU_IS_PR_BUILD=1"
          fi
          make "$@"

          echo "=== Build completed ==="

          OUT_DIR="${GITHUB_WORKSPACE}/out/aarch64"
          mkdir -p "$OUT_DIR"

          # Copy with KMI-specific naming
          cp kernelsu.ko "${OUT_DIR}/${KMI}_kernelsu.ko"

          echo "Copied to: ${OUT_DIR}/${KMI}_kernelsu.ko"
          ls -la "${OUT_DIR}/${KMI}_kernelsu.ko"
          echo "Size: $(du -h "${OUT_DIR}/${KMI}_kernelsu.ko" | cut -f1)"
          llvm-strip -d "${OUT_DIR}/${KMI}_kernelsu.ko"
          echo "Size after stripping: $(du -h "${OUT_DIR}/${KMI}_kernelsu.ko" | cut -f1)"
          cp "${OUT_DIR}/${KMI}_kernelsu.ko" "${GITHUB_WORKSPACE}/out/${KMI}_kernelsu.ko"

      - name: Upload kernelsu.ko artifact
        run: |
          set -eu
          . .github/scripts/ci/common.sh
          ci_artifact_put "aarch64-${KMI}-lkm" \
            "${GITHUB_WORKSPACE}/out/aarch64/${KMI}_kernelsu.ko"

      - name: Build kernelsu.ko for x64
        run: |
          set -eu
          cd kernel
          make clean

          echo "=== Preparing KDIR for x64 ==="

          mkdir -p /opt/ddk/kdir-x64
          unset ARCH
          unset CROSS_COMPILE
          export ARCH=x86_64
          kmi="$KMI"
          pushd "/opt/ddk/src/${kmi}"
          export KDIR="/opt/ddk/kdir-x64/${kmi}"

          # ddk-min images contain the source tarball, whose modpost patch is
          # not applied to the fresh x86 kdir.  Keep the patch idempotent so
          # this also works when the image already contains one or more fixes.
          MODPOST=scripts/mod/modpost.c
          sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
          sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
          sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"
          sed -i 's/__version_ext_names\\") =\\n/__version_ext_names\\") = \\"\\"\\n/' "$MODPOST"

          make O="$KDIR" gki_defconfig
          scripts/config --file "$KDIR/.config" -d LTO_CLANG -e LTO_NONE \
            -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
          if [ "$kmi" = "android16-6.12" ] || [ "$kmi" = "android17-6.18" ]; then
            scripts/config --file "$KDIR/.config" -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS
          fi
          make O="$KDIR" modules_prepare
          # Generate SELinux headers through Kbuild in this x86 output tree.
          make O="$KDIR" security/selinux/built-in.a
          popd

          echo "=== Building x64 kernelsu.ko for KMI: ${KMI} ==="

          set -- CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y
          if [ -n "$PACKAGE_NAME" ]; then
            set -- "$@" "KSU_PACKAGE_NAME=$PACKAGE_NAME"
          fi
          if [ -n "$EXPECTED_SIZE" ]; then
            set -- "$@" "KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
          fi
          if [ -n "$EXPECTED_HASH" ]; then
            set -- "$@" "KSU_EXPECTED_HASH=$EXPECTED_HASH"
          fi
          if [ -n "$KSU_VERSION_CODE" ]; then
            set -- "$@" "KSU_VERSION=$KSU_VERSION_CODE"
          fi
          if [ "$RELEASE_BUILD" = "true" ]; then
            set -- "$@" "KSU_BUILD_REF=release"
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            set -- "$@" "KSU_IS_PR_BUILD=1"
          fi

          MDIR="$(realpath .)"

          if [ "$kmi" = "android17-6.18" ]; then
            make -C "$KDIR" M="$MDIR" MO="$MDIR" compile_commands.json modules "$@"
          else
            make -C "$KDIR" M="$MDIR" src="$MDIR" compile_commands.json modules "$@"
          fi

          echo "=== Build completed ==="

          OUT_DIR="${GITHUB_WORKSPACE}/out/x86_64"
          mkdir -p "$OUT_DIR"

          cp kernelsu.ko "${OUT_DIR}/${KMI}_kernelsu.ko"

          echo "Copied to: ${OUT_DIR}/${KMI}_kernelsu.ko"
          ls -la "${OUT_DIR}/${KMI}_kernelsu.ko"
          echo "Size: $(du -h "${OUT_DIR}/${KMI}_kernelsu.ko" | cut -f1)"
          llvm-strip -d "${OUT_DIR}/${KMI}_kernelsu.ko"
          echo "Size after stripping: $(du -h "${OUT_DIR}/${KMI}_kernelsu.ko" | cut -f1)"

      - name: Upload x64 kernelsu.ko artifact
        run: |
          set -eu
          . .github/scripts/ci/common.sh
          ci_artifact_put "x86_64-${KMI}-lkm" \
            "${GITHUB_WORKSPACE}/out/x86_64/${KMI}_kernelsu.ko"
