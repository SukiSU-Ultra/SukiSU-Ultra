name: ClangFormat check

# Self-hosted runner variant: no marketplace actions, so nothing is fetched
# from github.com. Checkout pulls from the public Forgejo endpoint because build
# containers cannot reach the WSL EasyTier tunnel.
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/clang-format.yml'
      - 'kernel/**/*.c'
      - 'kernel/**/*.h'
      - 'kernel/.clang-format'

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          remote="https://git.zako.shirkneko.top:20004"
          mirror="/ci/repo-cache/${GITHUB_REPOSITORY}.git"
          mkdir -p "$(dirname "$mirror")"
          # One bare mirror per repository lives on the runner host, shared by
          # every job through the /ci volume. Re-downloading the whole history
          # per job made parallel jobs stall on the same fetch.
          if [ ! -d "$mirror" ]; then
            # The token must not appear in the trace of `set -x`.
            set +x
            git -c "http.${remote}/.extraHeader=Authorization: token ${TOKEN}" \
              clone -q --mirror "${remote}/${GITHUB_REPOSITORY}.git" "$mirror"
            set -x
          elif command -v flock >/dev/null 2>&1; then
            (
              flock 9
              git --git-dir="$mirror" fetch -q --prune origin \
                "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
            ) 9>"${mirror}.lock"
          else
            git --git-dir="$mirror" fetch -q --prune origin \
              "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          fi
          git clone -q --shared --no-checkout "$mirror" .
          git checkout -q "${GITHUB_SHA}"

      - name: Check toolchain
        run: clang-format --version

      - name: check
        working-directory: kernel
        run: make format

      - name: check
        working-directory: kernel
        run: make check-format
