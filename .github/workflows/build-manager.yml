name: Build Manager

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'scripts/upload-telegram.sh'
      - 'repack_apk.py'
      - 'split_apk_by_arch.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'scripts/upload-telegram.sh'
      - 'repack_apk.py'
      - 'split_apk_by_arch.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

  workflow_call:
    inputs:
      release_upload:
        description: 'Upload to the releases Telegram thread'
        required: false
        default: false
        type: boolean

jobs:

  generate-key:
    runs-on: ubuntu-latest

    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}

    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)

          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Extract certificate hash and size
        if: github.event_name == 'pull_request'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"


  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml


  build-ksud:
    needs: [build-lkm, build-ksuinit]

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
          - target: armv7-linux-androideabi
          - target: riscv64-linux-android
    uses: ./.github/workflows/ksud.yml

    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true


  # ------------------------------------------------------------
  # Build both normal and spoofed Manager APKs
  # ------------------------------------------------------------

  build-manager:
    needs: [generate-key, build-ksud]

    if: always() &&
        needs.generate-key.result == 'success' &&
        needs.build-ksud.result == 'success'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        spoofed: ["false", "true"]

    defaults:
      run:
        working-directory: ./manager

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Determine variant name
      # --------------------------------------------------------

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.spoofed }}" = "true" ]; then
            echo "title=Manager-spoofed" >> "$GITHUB_OUTPUT"
          else
            echo "title=Manager" >> "$GITHUB_OUTPUT"
          fi


      # --------------------------------------------------------
      # Reproduce the original SukiSU randomizer
      #
      # This is intentionally executed BEFORE Gradle.
      # --------------------------------------------------------

      - name: Run randomizer
        if: matrix.spoofed == 'true'
        run: |
          set -e

          echo "Building spoofed Manager"

          # Generate four random lowercase words.
          word1=$(tr -dc 'a-z' </dev/urandom | head -c6)
          word2=$(tr -dc 'a-z' </dev/urandom | head -c6)
          word3=$(tr -dc 'a-z' </dev/urandom | head -c6)
          word4=$(tr -dc 'a-z' </dev/urandom | head -c6)

          echo "Generated randomized package components."

          export word1 word2 word3 word4

          # Rename package directories.
          find . -depth -type d -name 'com' \
            -execdir mv {} "$word1" \;

          find . -depth -type d -name 'sukisu' \
            -execdir mv {} "$word2" \;

          find . -depth -type d -name 'ultra' \
            -execdir mv {} "$word3" \;

          find . -depth -type d -name 'io' \
            -execdir mv {} "$word4" \;

          # Replace package references inside files.
          find . -type f -exec sed -i \
            -e "s/com\.sukisu\.ultra/$word1.$word2.$word3/g" \
            -e "s/io\.sukisu\.ultra/$word4.$word2.$word3/g" \
            -e "s/com\.sukisu\.zako/$word1.$word2.zako/g" \
            -e "s/com\/sukisu\/ultra/$word1\/$word2\/$word3/g" \
            -e "s/io\/sukisu\/ultra/$word4\/$word2\/$word3/g" \
            -e "s/io_sukisu_ultra/${word4}_${word2}_${word3}/g" \
            -e "s/com_sukisu_ultra/${word1}_${word2}_${word3}/g" \
            {} +

          # Add -spoofed to getGitDescribe().
          sed -i \
            -e '/fun getGitDescribe(): String {/,/^    }/ s/\.trim()$/.trim() + "-spoofed"/' \
            build.gradle.kts

          echo "Randomization complete."


      # --------------------------------------------------------
      # Signing configuration
      # --------------------------------------------------------

      - name: Write key
        if: ${{ (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
          || github.ref_type == 'tag' }}

        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties

            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi


      - name: Write PR key
        if: github.event_name == 'pull_request'

        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}

        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks

          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='pr-key.jks'
          } >> gradle.properties


      # --------------------------------------------------------
      # Java / Gradle
      # --------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # --------------------------------------------------------
      # Download ksud artifacts
      # --------------------------------------------------------

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android


      - name: Download arm ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi


      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android


      # --------------------------------------------------------
      # Copy ksud into Manager
      # --------------------------------------------------------

      - name: Copy ksud to app jniLibs
        run: |
          set -e

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64

          ARM64_KSUD=$(find ../artifacts/ksud-aarch64-linux-android \
            -type f -name ksud | head -n 1)

          ARM_KSUD=$(find ../artifacts/ksud-armv7-linux-androideabi \
            -type f -name ksud | head -n 1)

          X86_64_KSUD=$(find ../artifacts/ksud-x86_64-linux-android \
            -type f -name ksud | head -n 1)

          test -n "$ARM64_KSUD"
          test -n "$ARM_KSUD"
          test -n "$X86_64_KSUD"

          # Randomize the packaged identity on every build so detectors cannot
          # pin stable anchors: the daemon/JNI library names and the component
          # class names (Application, ZygotePreload, activities, services).
          # Only the copies inside the APK change; /data/adb/ksud, the kernel
          # sucompat path and the module layout stay untouched.
          # Lowercase letters only: a hex name is itself a fingerprint that
          # /lib[0-9a-f]+\.so/ matches, while letter names look like ordinary
          # third-party libraries.
          rand_alpha() {
            openssl rand -base64 48 | tr -dc 'a-z' | cut -c1-"$1"
          }
          KSUD_LIB="lib$(rand_alpha 10).so"
          CORE_LIB="$(rand_alpha 11)"
          APP_CLASS="$(rand_alpha 11)"
          PRELOAD_CLASS="$(rand_alpha 11)"
          MAIN_CLASS="$(rand_alpha 11)"
          WEBUI_CLASS="$(rand_alpha 11)"
          DOWNLOAD_CLASS="$(rand_alpha 11)"
          MAGICA_CLASS="$(rand_alpha 11)"

          # Rewrite every identifier reference in one pass: sources, manifest
          # component names, JNI symbol names and the CMake targets.
          find app/src/main -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \
               -o -name '*.cc' -o -name 'CMakeLists.txt' \) \
            -exec sed -i \
              -e "s/\"libksud\.so\"/\"$KSUD_LIB\"/g" \
              -e "s/project(\"kernelsu\")/project(\"$CORE_LIB\")/" \
              -e "s/add_library(kernelsu/add_library($CORE_LIB/" \
              -e "s/target_include_directories(kernelsu /target_include_directories($CORE_LIB /" \
              -e "s/target_link_libraries(kernelsu /target_link_libraries($CORE_LIB /" \
              -e "s/loadLibrary(\"kernelsu\")/loadLibrary(\"$CORE_LIB\")/g" \
              -e "/^[[:space:]]*[*\/]/!s/KernelSUApplication/${APP_CLASS}Application/g" \
              -e "/^[[:space:]]*[*\/]/!s/AppZygotePreload/${PRELOAD_CLASS}Preload/g" \
              -e "/^[[:space:]]*[*\/]/!s/MainActivity/${MAIN_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/WebUIActivity/${WEBUI_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/DownloadService/${DOWNLOAD_CLASS}Service/g" \
              -e "/^[[:space:]]*[*\/]/!s/MagicaService/${MAGICA_CLASS}Service/g" \
              {} +

          # Rename the files that carry the identifier in their names.
          find app/src/main -depth -type f -name 'KernelSUApplication.kt' \
            -execdir mv {} "${APP_CLASS}Application.kt" \;
          find app/src/main -depth -type f -name 'AppZygotePreload.java' \
            -execdir mv {} "${PRELOAD_CLASS}Preload.java" \;
          find app/src/main -depth -type f -name 'MainActivity.kt' \
            -execdir mv {} "${MAIN_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'MainActivityUiState.kt' \
            -execdir mv {} "${MAIN_CLASS}ActivityUiState.kt" \;
          find app/src/main -depth -type f -name 'MainActivityViewModel.kt' \
            -execdir mv {} "${MAIN_CLASS}ActivityViewModel.kt" \;
          find app/src/main -depth -type f -name 'WebUIActivity.kt' \
            -execdir mv {} "${WEBUI_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'DownloadService.kt' \
            -execdir mv {} "${DOWNLOAD_CLASS}Service.kt" \;
          find app/src/main -depth -type f -name 'MagicaService.java' \
            -execdir mv {} "${MAGICA_CLASS}Service.java" \;

          echo "Packaged identity: $KSUD_LIB, lib$CORE_LIB.so, ${APP_CLASS}Application, ${PRELOAD_CLASS}Preload"

          cp -f "$ARM64_KSUD" \
            "app/src/main/jniLibs/arm64-v8a/$KSUD_LIB"

          cp -f "$ARM_KSUD" \
            "app/src/main/jniLibs/armeabi-v7a/$KSUD_LIB"

          cp -f "$X86_64_KSUD" \
            "app/src/main/jniLibs/x86_64/$KSUD_LIB"


      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease
          fi


      # --------------------------------------------------------
      # Upload un-repacked APK
      # --------------------------------------------------------

      - name: Upload Gradle APK
        if: ${{ github.event_name == 'pull_request' ||
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/dev')) ||
          github.ref_type == 'tag' }}

        uses: actions/upload-artifact@v7

        with:
          name: ${{ steps.determine.outputs.title }}-gradle
          path: manager/app/build/outputs/apk/release/*.apk


      # --------------------------------------------------------
      # Upload mappings
      # --------------------------------------------------------

      - name: Upload mappings
        if: ${{ (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/dev'))
          || github.ref_type == 'tag' }}

        uses: actions/upload-artifact@v7

        with:
          name: "${{ steps.determine.outputs.title }}-mappings"
          path: "manager/app/build/outputs/mapping/release/"


  # ------------------------------------------------------------
  # Repack both variants
  # ------------------------------------------------------------

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]

    if: always() &&
        needs.build-manager.result == 'success' &&
        needs.build-ksud.result == 'success' &&
        needs.generate-key.result == 'success'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        spoofed: ["false", "true"]

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Determine artifact names
      # --------------------------------------------------------

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.spoofed }}" = "true" ]; then
            echo "title=Manager-spoofed" >> "$GITHUB_OUTPUT"
          else
            echo "title=Manager" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # Download correct Manager variant
      # --------------------------------------------------------

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-gradle
          path: artifacts/manager-gradle


      # --------------------------------------------------------
      # Download ksud
      # --------------------------------------------------------

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android


      - name: Download arm ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi


      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android
      
      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android

      # --------------------------------------------------------
      # Place Manager APK and ksud artifacts
      # --------------------------------------------------------

      - name: Place manager apk and ksud artifacts
        id: place_artifacts
        run: |
          set -e

          mkdir -p manager/app/build/outputs/apk/release

          APK=$(find artifacts/manager-gradle \
            -type f -name "*.apk" | head -n 1)

          test -n "$APK"

          echo "APK_STEM=$(basename "$APK" .apk)" >> "$GITHUB_OUTPUT"

          cp -f "$APK" \
            manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release

          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android \
            -type f -name ksud | head -n 1)

          ARM_KSUD=$(find artifacts/ksud-armv7-linux-androideabi \
            -type f -name ksud | head -n 1)

          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android \
            -type f -name ksud | head -n 1)

          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android \
            -type f -name ksud | head -n 1)

          test -n "$ARM64_KSUD"
          test -n "$ARM_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"

          cp -f "$ARM64_KSUD" \
            target/aarch64-linux-android/release/ksud

          cp -f "$ARM_KSUD" \
            target/armv7-linux-androideabi/release/ksud

          cp -f "$X86_64_KSUD" \
            target/x86_64-linux-android/release/ksud

          cp -f "$RISCV64_KSUD" \
            target/riscv64-linux-android/release/ksud


      # --------------------------------------------------------
      # Prepare signing inputs
      # --------------------------------------------------------

      - name: Prepare signing inputs
        if: ${{ github.event_name == 'pull_request' ||
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/dev')) ||
          github.ref_type == 'tag' }}

        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}

          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then

            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks

            echo "SIGN_KEYSTORE_FILE=pr-key.jks" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=pr-key" >> "$GITHUB_ENV"
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> "$GITHUB_ENV"

          else

            test -n "$PROD_KEYSTORE"

            echo "$PROD_KEYSTORE" | base64 -d > key.jks

            echo "SIGN_KEYSTORE_FILE=key.jks" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> "$GITHUB_ENV"

          fi


      # --------------------------------------------------------
      # Repack and resign
      # --------------------------------------------------------

      - name: Repack and resign
        if: ${{ github.event_name == 'pull_request' ||
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/dev')) ||
          github.ref_type == 'tag' }}

        run: |
          SUFFIX=""
          if [ "${{ matrix.spoofed }}" = "true" ]; then
            SUFFIX="-spoofed"
          fi

          OUTPUT_NAME="${{ steps.place_artifacts.outputs.APK_STEM }}${SUFFIX}"

          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -a riscv64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip \
            --output-name "$OUTPUT_NAME"


      # --------------------------------------------------------
      # Upload final APK
      # --------------------------------------------------------

      - name: Upload build artifact
        if: ${{ github.event_name == 'pull_request' ||
          (github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/dev')) ||
          github.ref_type == 'tag' }}

        uses: actions/upload-artifact@v7

        with:
          name: ${{ steps.determine.outputs.title }}
          path: dist/*.apk



  publish-manager-ci:
    needs: repack-manager
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-manager-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: Manager
          path: ci-release
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Split and sign CI APKs by architecture
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_KEYSTORE"
          KEYSTORE="$RUNNER_TEMP/manager-ci.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$PROD_KEYSTORE" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          APK=$(find ci-release -type f -name '*.apk' -print -quit)
          test -n "$APK"
          python3 split_apk_by_arch.py \
            -i "$APK" \
            -o ci-release/split \
            -K "$KEYSTORE" \
            -A "$PROD_KEY_ALIAS" \
            -P "$PROD_KEYSTORE_PASSWORD" \
            -S "$PROD_KEY_PASSWORD"
      - name: Publish rolling CI prerelease
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Skip old builds that finish after a newer commit has reached main.
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated build"
            exit 0
          fi
          APK=$(find ci-release/split -type f -name '*.apk' -print -quit)
          test -n "$APK"
          VERSION_CODE=$(python3 -c 'import re,sys; m=re.search(r"_(\d+)-(?:(?:arm64-v8a|armeabi-v7a|x86_64|riscv64)-)?release",sys.argv[1]); print(m.group(1) if m else "")' "$APK")
          test -n "$VERSION_CODE"
          if ! gh release view manager-ci >/dev/null 2>&1; then
            gh release create manager-ci --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Manager CI ($VERSION_CODE)" --notes 'Rolling main-branch CI build. Experimental; may be unstable.'
          fi
          # Publish architecture-specific APKs with their original versioned names.
          gh release view manager-ci --json assets --jq '.assets[].name' | while IFS= read -r name; do
            gh release delete-asset manager-ci "$name" --yes
          done
          gh release upload manager-ci ci-release/split/*.apk --clobber
          {
            printf '## Manager CI\n\n'
            printf -- '- **Branch:** `main`\n'
            printf -- '- **Version code:** `%s`\n' "$VERSION_CODE"
            printf -- '- **Commit:** [`%s`](https://github.com/%s/commit/%s)\n' "${GITHUB_SHA:0:8}" "$GH_REPO" "$GITHUB_SHA"
            printf -- '- **Build:** [#%s](https://github.com/%s/actions/runs/%s)\n\n' "$GITHUB_RUN_NUMBER" "$GH_REPO" "$GITHUB_RUN_ID"
            printf '> Experimental build; may be unstable.\n\n### Recent changes\n\n'
            git log -5 --format='- %s (`%h`)' "$GITHUB_SHA"
          } > ci-release/notes.md
          gh release edit manager-ci --prerelease --latest=false \
            --title "Manager CI ($VERSION_CODE)" \
            --notes-file ci-release/notes.md


  # ------------------------------------------------------------
  # Telegram upload (separate threads for normal / spoofed,
  # split per-arch before upload)
  # ------------------------------------------------------------

  upload-telegram:
    needs: repack-manager

    if: github.event_name != 'pull_request' &&
        needs.repack-manager.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Determine whether Telegram upload is configured
      # --------------------------------------------------------

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> "$GITHUB_OUTPUT"
          else
            echo "UPLOAD=false" >> "$GITHUB_OUTPUT"
          fi


      # --------------------------------------------------------
      # Download APK artifacts (keep variants in separate dirs)
      # --------------------------------------------------------

      - name: Download manager apk
        if: steps.need_upload.outputs.UPLOAD == 'true'
        uses: actions/download-artifact@v8
        with:
          name: Manager
          path: apks/manager

      - name: Download manager-spoofed apk
        if: steps.need_upload.outputs.UPLOAD == 'true'
        uses: actions/download-artifact@v8
        with:
          name: Manager-spoofed
          path: apks/manager-spoofed

      
      # --------------------------------------------------------
      # Prepare signing inputs (needed by split + apksigner)
      # --------------------------------------------------------

      - name: Prepare signing inputs
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$PROD_KEYSTORE"
          echo "$PROD_KEYSTORE" | base64 -d > key.jks
          echo "SIGN_KEYSTORE_FILE=key.jks" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Split per-arch before uploading (keep full original name)
      # --------------------------------------------------------

      - name: Split Manager APK by arch
        if: steps.need_upload.outputs.UPLOAD == 'true'
        run: |
          APK=$(find apks/manager -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          python3 split_apk_by_arch.py \
            -i "$APK" \
            -o apks/split-manager \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD"

      - name: Split Manager-spoofed APK by arch
        if: steps.need_upload.outputs.UPLOAD == 'true'
        run: |
          APK=$(find apks/manager-spoofed -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          python3 split_apk_by_arch.py \
            -i "$APK" \
            -o apks/split-manager-spoofed \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD"


      # --------------------------------------------------------
      # Verify each split APK contains exactly one architecture
      # --------------------------------------------------------

      - name: Verify split APK arch
        if: steps.need_upload.outputs.UPLOAD == 'true'
        run: |
          for apk in apks/split-manager/*.apk apks/split-manager-spoofed/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk =="
            unzip -l "$apk" | grep ' lib/' | awk -F/ '{print $2}' | sort -u
          done


      # --------------------------------------------------------
      # Telegram upload - normal Manager (all per-arch APKs)
      # --------------------------------------------------------

      - name: Upload Manager to telegram
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ inputs.release_upload && secrets.MESSAGE_RELEASES_THREAD_ID || secrets.MESSAGE_THREAD_ID }}
          GITHUB_EVENT: ${{ toJson(github.event) }}

          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          TITLE: Manager
          BRANCH: ${{ github.ref_name }}

        shell: bash
        run: |
          set -euo pipefail
          export VERSION="$(git rev-list --count HEAD)"
          mapfile -d '' APKS < <(find ./apks/split-manager -type f -name '*.apk' -print0 | sort -z)
          test "${#APKS[@]}" -gt 0
          bash scripts/upload-telegram.sh "${APKS[@]}"


      # --------------------------------------------------------
      # Telegram upload - spoofed Manager (separate thread)
      # --------------------------------------------------------

      - name: Upload Manager-spoofed to telegram
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ inputs.release_upload && secrets.MESSAGE_RELEASES_THREAD_ID || secrets.MESSAGE_SPOOFED_THREAD_ID }}
          GITHUB_EVENT: ${{ toJson(github.event) }}

          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          TITLE: Manager-spoofed
          BRANCH: ${{ github.ref_name }}

        shell: bash
        run: |
          set -euo pipefail
          export VERSION="$(git rev-list --count HEAD)"
          mapfile -d '' APKS < <(find ./apks/split-manager-spoofed -type f -name '*.apk' -print0 | sort -z)
          test "${#APKS[@]}" -gt 0
          bash scripts/upload-telegram.sh "${APKS[@]}"
