name: ShellCheck

# Rewritten for the self-hosted Forgejo runner: no `uses:` actions, so the job
# never needs github.com. ShellCheck comes from the distribution packages.
#
# The checkout uses the public HTTPS URL, not the EasyTier address the runner
# itself talks to: build containers get their own network namespace and cannot
# reach the WSL tunnel (tun0), while the public endpoint is reachable from both.
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/*.sh'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - '**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          remote="https://git.zako.shirkneko.top:20004"
          mirror="/ci/repo-cache/${GITHUB_REPOSITORY}.git"
          mkdir -p "$(dirname "$mirror")"
          # One bare mirror per repository lives on the runner host, shared by
          # every job through the /ci volume. Re-downloading the whole history
          # per job made parallel jobs stall on the same fetch.
          if [ ! -d "$mirror" ]; then
            # The token must not appear in the trace of `set -x`.
            set +x
            git -c "http.${remote}/.extraHeader=Authorization: token ${TOKEN}" \
              clone -q --mirror "${remote}/${GITHUB_REPOSITORY}.git" "$mirror"
            set -x
          elif command -v flock >/dev/null 2>&1; then
            (
              flock 9
              git --git-dir="$mirror" fetch -q --prune origin \
                "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
            ) 9>"${mirror}.lock"
          else
            git --git-dir="$mirror" fetch -q --prune origin \
              "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          fi
          git clone -q --shared --no-checkout "$mirror" .
          git checkout -q "${GITHUB_SHA}"

      - name: Check toolchain
        run: shellcheck --version | head -2

      - name: Run ShellCheck
        run: |
          set -eux
          shellcheck --version | head -2
          # Same exclusions as the previous marketplace action config.
          mapfile -t files < <(
            git ls-files '*.sh' \
              | grep -v -E '(^|/)(gradlew)$' \
              | grep -v -E '^userspace/ksud/src/installer\.sh$' \
              | grep -v -E '^\.github/scripts/setup-rust-build\.sh$' \
            || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts to check"
            exit 0
          fi
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck -x "${files[@]}"
