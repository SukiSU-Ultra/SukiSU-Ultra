name: Build LKM for KernelSU

# Self-hosted runner variant. This file only fans the matrix out to ddk-lkm.yml,
# which is a reusable workflow in the same repository, so it needs no rewrite:
# local `uses:` never reaches github.com.
on:
  workflow_call:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Consistent KernelSU version code for all module builds'
        required: false
        default: ''
        type: string
      release_build:
        description: 'Mark version metadata as a release build'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      package_name: ${{ inputs.package_name || '' }}
      expected_size: ${{ inputs.expected_size || '' }}
      expected_hash: ${{ inputs.expected_hash || '' }}
      version_code: ${{ inputs.version_code || '' }}
      release_build: ${{ inputs.release_build }}
